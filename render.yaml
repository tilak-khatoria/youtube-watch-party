services:
  # =======================================================
  # 1. Backend Web Service (Express + Socket.IO)
  # =======================================================
  - type: web
    name: youtube-watch-party-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false

  # =======================================================
  # 2. Frontend Static Site (React + Vite Single Page App)
  # =======================================================
  - type: web
    name: youtube-watch-party-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false
